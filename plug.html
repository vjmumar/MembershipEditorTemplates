<script>
    fetch("https://membershipeditor.netlify.app/editor")
    ?.then((e) => e.text())
    ?.then(e => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(e, 'text/html');
        Array.from(doc.head.children).forEach(el => {
            document.body.prepend(el);
        })
    });
</script>

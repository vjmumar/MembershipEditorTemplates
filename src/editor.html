<style id="editor">
   #app {
      display: flex;
   }

   #app-container {
      flex: 1;
   }

   [data-editable="true"] {
      outline: 1px dashed rgb(7 0 255);
      outline-offset: -1px;
      cursor: pointer;
   }

   [data-editable="true"] iframe {
      pointer-events: none;
   }

   [data-editable="true"]:hover {
      outline-width: 2px;
   }

   .jscolor-wrap {
      z-index: 9999999999 !important;
   }

   .tox-tinymce-aux {
      z-index: 999999999999999 !important;
   }

   .tox .tox-editor-header,
   .tox .tox-toolbar,
   .tox .tox-toolbar__group,
   .tox .tox-tbtn,
   .tox .tox-tbtn--select,
   .tox .tox-listbox,
   .tox .tox-collection,
   .tox .tox-menu,
   .tox.tox-tinymce {
      border-radius: 0 !important;
   }

   .tox.tox-tinymce {
      border: 1px solid #d0d0d0 !important;
      box-shadow: none !important;
   }

   .tox .tox-tbtn {
      box-shadow: none !important;
   }

   /* Editor */
   .editor-customizer-sidebar  * {
     margin: 0;
   }

   .editor-customizer-sidebar {
      background-color: #ffffff;
   }

   .editor-customizer-sidebar input[type="text"],
   .editor-customizer-sidebar input[type="number"],
   .editor-customizer-sidebar input[type="color"],
   .editor-customizer-sidebar input[type="checkbox"],
   .editor-customizer-sidebar select {
      font-size: 13px;
      padding: 5px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 100%;
      outline: none;
      text-align: left;
      transition:
         border-color 0.2s,
         box-shadow 0.2s;
   }

   .editor-customizer-sidebar input::placeholder {
      color: #999;
      opacity: 1;
      font-size: 12px;
      text-align: left;
   }

   .editor-customizer-sidebar input[type="text"]:focus,
   .editor-customizer-sidebar input[type="number"]:focus,
   .editor-customizer-sidebar input[type="color"]:focus,
   .editor-customizer-sidebar input[type="checkbox"]:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
   }

   .editor-customizer-sidebar input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #7c3aed;
   }

   .editor-customizer-sidebar input[type="color"] {
      padding: 0;
      width: 40px;
      height: 32px;
      cursor: pointer;
   }

   .editor-customizer-sidebar textarea {
      width: 100%;
      min-height: 140px;
      padding: 10px;
      font-size: 13px;
      font-family: monospace;
      line-height: 1.4;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fafafa;
      overflow: auto;
      resize: vertical;
   }

   .editor-customizer-sidebar textarea::placeholder {
      font-family: monospace;
      opacity: 0.5;
   }

   /* Customizer */
   .editor-customizer-sidebar {
      width: 320px;
      height: 100vh;
      position: sticky;
      display: none;
      top: 0;
      box-shadow: 1px 1px black;
   }

   .editor-customizer-sidebar.active {
      display: block;
   }

   .editor-customizer-header {
      display: flex;
      align-items: center;
      padding: 25px 15px;
      background-color: white;
      border-bottom: 1px solid #e5e7eb;
      justify-content: space-between;
      height: 40px;
      position: sticky;
      z-index: 9999;
      top: 0;
   }

   .editor-customizer-category {
      display: flex;
      margin-bottom: 10px;
   }

   .editor-customizer-category__item {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f0f1f1;
      font-size: 13px;
      padding-block: 10px;
      border-bottom: 3px solid transparent;
      cursor: pointer;
   }

   .editor-customizer-category__item.active {
      border-color: #10b981;
   }

   .editor-customizer-header__global {
      font-size: 20px;
      color: black;
      cursor: pointer;
   }

   .editor-customizer-header__text {
      font-weight: 700;
      font-size: 14px;
      color: black;
      text-align: center;
   }

   .editor-customizer-sidebar__content {
      height: calc(100vh - 70px);
      overflow-y: auto;
   }

   .editor-customizer-form {
      height: calc(100% - 40px);
      overflow-y: auto;
   }

   .editor-customizer-item__form {
      padding-inline: 10px;
   }

   .editor-customizer-item__form__item {
      margin-bottom: 15px;
      display: none;
   }

   .editor-customizer-item__form__item.active {
      display: block;
   }

   .editor-customizer-item__form__item__title {
      font-size: 13px;
      margin-bottom: 10px;
   }

   .editor-customizer-item__form__item__input__group {
      margin-bottom: 15px;
   }

   .editor-customizer-item__form__item__input__group__name {
      font-size: 11px;
   }

   .editor-customizer-item__form__item__input__group__toggler {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 10px;
      margin-top: 5px;
   }

   .editor-customizer-item__form__item__input__group__toggler p {
      font-size: 13px;
   }

   .editor-customizer-item__form__item__input__group__name__toggler {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 14px;
      background-color: #f0f0f0;
      padding: 7px 10px;
      border-radius: 3px;
   }

   .editor-customizer-item__form__item__input__group__name__toggler i {
      font-size: 11px;
   }

   .editor-customizer-item__form__item__input__group.feature.active
      .editor-customizer-item__form__item__input__group__name__toggler
      i {
      rotate: 90deg !important;
   }

   .editor-customizer-item__form__item__input__group__content {
      display: none;
   }

   .editor-customizer-item__form__item__input__group.feature.active
      .editor-customizer-item__form__item__input__group__content {
      display: flex;
      flex-direction: column;
      padding-block: 10px;
      border: 1px solid #f0f0f0;
      padding-inline: 6px;
      border-top: none;
   }

   /* Customization Group */
   .editor-customizer-item__form__item__input__group__group {
      margin-bottom: 5px;
   }

   .editor-customizer-item__form__item__input__group__group__header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      background-color: #f0f0f0;
      padding-inline: 5px;
      align-items: center;
      padding-block: 5px;
      cursor: pointer;
   }

   .editor-customizer-item__form__item__input__group__group__header p {
      font-size: 12px;
   }

   .editor-customizer-item__form__item__input__group__group__header i {
      font-size: 9px;
   }

   .editor-customizer-item__form__item__input__group__group.active
      .editor-customizer-item__form__item__input__group__group__header
      i {
      transform: rotate(180deg);
   }

   .editor-customizer-item__form__item__input__group__group__contents {
      padding-block: 10px 2px;
      padding-inline: 8px;
      border: 1px solid #f0f0f0;
      border-top: 0px;
      display: none;
   }

   .editor-customizer-item__form__item__input__group__group.active
      .editor-customizer-item__form__item__input__group__group__contents {
      display: block;
   }

   .editor-customizer-item__form__item__input__group__group__contents__controller {
      display: flex;
      gap: 5px;
      align-items: center;
      padding-bottom: 7px;
   }

   .editor-customizer-item__form__item__input__group__group__contents__controller button {
      font-size: 13px;
      display: flex;
      align-items: center;
   }

   .editor-customizer-item__form__item__input__group__group__contents__controller
      button:first-of-type {
      color: red;
   }

   .editor-customizer-item__form__item__input__group__group__contents__controller
      button:first-of-type::after {
      content: "";
      display: block;
      width: 1.5px;
      height: 15px;
      background: #252525a1;
      color: red;
      margin-left: 7px;
   }

   .editor-customizer-item__form__item__input__group__group__contents__controller
      button:last-of-type {
      color: #000000;
   }

   /* Global */
   .global-contents__header {
      display: flex;
      align-items: center;
      padding: 25px 15px;
      background-color: white;
      border-bottom: 1px solid #e5e7eb;
      justify-content: space-between;
      margin-bottom: 10px;
      position: sticky;
      top: 0;
      height: 40px;
      z-index: 9999;
   }

   .global-contents__header__mobile-switch {
      font-size: 20px;
      color: black;
      cursor: pointer;
   }

   .global-contents__header__text {
      font-weight: 700;
      font-size: 14px;
      color: black;
   }

   .global-contents__header__control {
      background-color: #f0f0f0;
      padding: 8px 10px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
   }

   .global-contents__header__control i {
      color: #000000;
      cursor: pointer;
   }

   .global-contents__header__control i.disabled {
      pointer-events: none;
      opacity: 0.5;
   }

   .global-contents__header__control::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      margin: auto;
      height: 70%;
      width: 1px;
      background-color: #0000002e;
   }

   .global-contents__separator {
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-inline: 10px;
   }

   .global-contents__separator::before,
   .global-contents__separator::after {
      content: "";
      height: 0.5px;
      flex: 1;
      background-color: #364758;
   }

   .global-contents-item {
      padding: 10px;
      margin-bottom: 0px;
      padding-bottom: 0;
   }

   .global-contents-item__toggler {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #8080801f;
      padding: 10px;
      cursor: pointer;
      border-radius: 5px;
   }

   .global-contents-item.active .global-contents-item__toggler {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
   }

   .global-contents-item__toggler p {
      font-size: 15px;
   }

   .global-contents-item__toggler i {
      font-size: 11px;
   }

   .global-contents-item.active .global-contents-item__toggler i {
      rotate: 90deg;
   }

   .global-contents-item__wrapper {
      padding: 10px;
      border: 1px solid #8080801f;
      display: none;
      border-radius: 5px;
      border-top: 0;
      border-top-left-radius: 0;
      border-top-right-radius: 0;
   }

   .global-contents-item.active .global-contents-item__wrapper {
      display: block;
   }

   .global-contents-item__item {
      margin-bottom: 5px;
   }

   .global-contents-item__item__title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 14px;
      background-color: #f0f0f0;
      padding: 5px;
      border-radius: 3px;
   }

   .global-contents-item__item.active .global-contents-item__item__title {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
   }

   .global-contents-item__item.active .global-contents-item__item__title i {
      rotate: 90deg;
   }

   .global-contents__additional-settings {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #8080801f;
      padding: 10px;
      cursor: pointer;
      border-radius: 5px;
      margin: 10px;
   }

   .global-contents__additional-settings p {
      font-size: 15px;
   }

   .global-contents__additional-settings i {
      font-size: 11px;
   }

   /* Additional Settings Header */
   .additional-settings-header {
      display: flex;
      align-items: center;
      padding: 25px 15px;
      background-color: white;
      border-bottom: 1px solid #e5e7eb;
      justify-content: space-between;
      margin-bottom: 10px;
      position: sticky;
      top: 0;
      height: 40px;
      z-index: 9999;
   }

   .additional-settings-header__text {
      font-weight: 700;
      font-size: 14px;
      color: black;
   }

   .additional-settings-header__icon {
      font-size: 20px;
      color: black;
      cursor: pointer;
   }

   /* Advance settings */
   .advance-settings__thumbnail-placeholder {
      margin: 10px;
   }

   .advance-settings__thumbnail-placeholder__label {
      font-size: 13px;
      margin-bottom: 6px;
   }

   .advance-settings__thumbnail-placeholder__preview {
      width: 100%;
      height: 150px;
      background-size: 100% 100%;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 6px;
      background-position: center;
   }

   .advance-settings__thumbnail-placeholder__info {
      font-size: 9px;
      margin-bottom: 9px;
   }

   .advance-settings__customcss {
      margin: 10px;
   }

   .advance-settings__fonts {
      margin: 10px;
      margin-bottom: 20px;
   }

   .advance-settings__fonts__label {
      font-size: 13px;
      margin: 0;
      font-weight: 500;
      color: #374151;
   }

   .advance-settings__fonts__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      background-color: #f9fafb;
      border-radius: 6px;
      margin-bottom: 4px;
      transition: background-color 0.2s;
   }

   .advance-settings__fonts__upload-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #3b82f6;
      font-weight: 500;
   }

   .advance-settings__fonts__list {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: #ffffff;
   }

   .advance-settings__fonts__item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid #f3f4f6;
      font-size: 14px;
      color: #374151;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
   }

   .advance-settings__fonts__item:last-child {
      border-bottom: none;
   }

   .advance-settings__fonts__item__info {
      display: flex;
      flex-direction: column;
   }

   .advance-settings__fonts__item__meta {
      font-size: 9.5px;
   }

   .advance-settings__fonts__item i {
      cursor: pointer;
      color: #9ca3af;
      font-size: 14px;
      transition: color 0.2s;
      padding: 4px;
   }

   .advance-settings__fonts__item i:hover {
      color: #ef4444;
   }

   .advance-settings__fonts__empty {
      padding: 20px;
      text-align: center;
      font-size: 13px;
      color: #9ca3af;
      font-style: italic;
   }

   /* Editable Pages */
   .editable-pages__list {
      display: flex;
      flex-direction: column;
      padding: 0 10px;
      gap: 8px;
   }

   .editable-pages__list__item {
      display: flex;
      align-items: center;
      background-color: #8080801f;
      padding: 10px;
      cursor: pointer;
      border-radius: 5px;
      gap: 10px;
   }

   .editable-pages__list__item input {
   }

   .editable-pages__list__item p {
      font-size: 12px;
   }

   /* Sidebar Footer */
   .editor-customizer-sidebar__footer {
      display: flex;
      border-top: 1px solid #e5e7eb;
      padding: 16px;
      gap: 8px;
      flex-shrink: 0;
      align-items: center;
      height: 70px;
   }

   .editor-customizer-sidebar__footer__button {
      flex: 1;
      padding: 0 16px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      min-height: 40px;
      border-radius: 6px;
   }

   .editor-customizer-hide {
      border: 1px solid #4b5563;
      color: #4b5563;
   }

   .editor-customizer-exit {
      border: 1px solid red;
      color: red;
   }

   .editor-customizer-save {
      background-color: #10b981;
      color: white;
   }

   .editor-customizer-save::before {
      content: "Save";
   }

   .editor-customizer-save.saving {
      opacity: 0.5;
      background-color: #10b981c0;
      pointer-events: none;
      cursor: none;
   }

   .editor-customizer-save::before.saving {
      content: "Saving...";
   }

   /* Additional Settings */
   .additional-settings-header {
      display: flex;
      align-items: center;
      padding: 25px 15px;
      background-color: white;
      border-bottom: 1px solid #e5e7eb;
      justify-content: space-between;
      margin-bottom: 10px;
      position: sticky;
      top: 0;
      height: 40px;
      z-index: 9999;
   }

   .additional-settings-header__text {
      font-weight: 700;
      font-size: 14px;
      color: black;
   }

   .additional-settings-header__icon {
      font-size: 20px;
      color: black;
      cursor: pointer;
   }

   /* Branding Customizer */
   .branding-customizer {
      padding: 10px;
   }

   .branding-customizer__item {
      margin-bottom: 8px;
   }

   .branding-customizer__item__title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 15px;
      background-color: #f0f0f0;
      padding: 6px;
      border-radius: 3px;
   }

   .branding-customizer__item.active .branding-customizer__item__title {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
   }

   .branding-customizer__item.active .branding-customizer__item__title i {
      rotate: 90deg;
   }

   .branding-customizer__item.active .branding-customizer__item__wrapper {
      display: block;
   }

   .branding-customizer__item__wrapper {
      padding: 8px;
      border: 1px solid #f0f0f0;
      border-top: none;
      display: none;
   }

   /* Theme Selector */
   .theme-selector__list {
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      gap: 5px;
      padding-inline: 10px;
   }

   .theme-selector__list__item__image {
      width: 100%;
      height: fit-content;
      object-fit: contain;
      min-height: 150px;
   }

   .theme-selector__list__item__content {
      position: relative;
   }

   .theme-selector__list__item__title {
      text-align: center;
      font-size: 11px;
      background-color: #10b98166;
      padding-block: 5px;
      color: black;
      letter-spacing: 0.3px;
   }

   .theme-selector__list__item {
      border-radius: 0px;
      overflow: hidden;
   }

   .theme-selector__list__item__controller {
      display: flex;
      align-items: center;
      justify-content: space-between;
   }

   .theme-selector__list__item__controller__info {
      font-size: 14px;
      text-align: center;
      padding-block: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background-color: #ededed;
   }

   .theme-selector__list__item__controller__button {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 13px;
      text-align: center;
      width: 50%;
      background-color: rgba(0, 0, 0, 0.07);
      cursor: pointer;
      flex: 1 1 0%;
      padding-block: 7px;
      text-decoration: none !important;
   }

   .theme-selector__list__item__controller__button.use {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 13px;
      text-align: center;
      width: 50%;
      background-color: rgba(0, 0, 0, 0.07);
      cursor: pointer;
      flex: 1 1 0%;
      padding-block: 7px;
      text-decoration: none !important;
      color: black !important;
   }

   /* Upload Font Modal */
   .upload-font-popup {
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
   }

   .upload-font-popup__title {
      margin: 0 0 16px 0;
      font-size: 18px;
      font-weight: 600;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
   }

   .upload-font-popup__content {
      display: flex;
      flex-direction: column;
      gap: 16px;
   }

   .upload-font-popup__description {
      margin: 0;
      font-size: 14px;
      color: #6b7280;
      line-height: 1.5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
   }

   .upload-font-popup__dropzone {
      border: 2px dashed #d1d5db;
      border-radius: 8px;
      padding: 32px 24px;
      text-align: center;
      cursor: pointer;
      transition:
         border-color 0.2s,
         background-color 0.2s;
      background-color: #f9fafb;
   }

   .upload-font-popup__dropzone:hover {
      border-color: #3b82f6;
      background-color: #eff6ff;
   }

   .upload-font-popup__dropzone i {
      font-size: 32px;
      color: #9ca3af;
      margin-bottom: 8px;
   }

   .upload-font-popup__dropzone:hover i {
      color: #3b82f6;
   }

   .upload-font-popup__dropzone p {
      margin: 0;
      font-size: 14px;
      color: #6b7280;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
   }

   .upload-font-popup__file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
   }

   .upload-font-popup__file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background-color: #f3f4f6;
      border-radius: 6px;
      font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
   }

   .upload-font-popup__file-item span {
      color: #374151;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
   }

   .upload-font-popup__file-item i {
      color: #10b981;
      margin-right: 8px;
   }

   .upload-font-popup__selected-file {
      margin-bottom: 16px;
   }

   .upload-font-popup__font-name {
      margin-top: 16px;
   }

   .upload-font-popup__font-name label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #374151;

<link

<!-- JS for features -->
<script src="
    https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js
    "></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

   src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.2/tinymce.min.js"

   src="https://cdnjs.cloudflare.com/ajax/libs/jscolor/2.5.2/jscolor.min.js"
   integrity="sha512-qFhMEJrjI50TwLDGZ7Oi0ksTSWnFOqTNXhlqqUgWnE65S23rWUtQOv+tMNEybkMYSXKgAc3eg/SzkX+qrtJT/g=="
   crossorigin="anonymous"
   referrerpolicy="no-referrer"
></script>
<script src="https://kit.fontawesome.com/d84a98056b.js"></script>
<script id="bm-membership-parser">
    class MembershipPreview {
      constructor() {
         this.isPreviewEditor = location.href.includes("isEditorPreview=true");
         if (this.isPreviewEditor) {
            setTimeout(() => {
               this.initializers.init();
            }, 3000);
         }
      }

      // Initializer module
      initializers = {
         // This method serves as the entry point for the application initialization
         init: () => {
            // First we will loop over all items from the activePageOnTemplate to prepare the DOM elements
            window.MembershipParser.activePageOnTemplate.forEach((item) => {
               document.querySelectorAll(item.elementSelector).forEach(($element) => {
                  // First we will attach the required attributes so our editor can identify it
                  $element?.setAttribute("data-editable", "true");
                  $element?.setAttribute("data-editor-key", item.key);

                  /**
                   * Finally we will re-render the element by resetting its outerHTML.
                   * This is needed because some SPA frameworks handle navigation without full page reloads.
                   * By forcing a re-render, all existing event listeners on the element are removed,
                   * preventing unintended navigation or stale event bindings.
                   */
                  if ($element) $element.outerHTML = $element.outerHTML;
               });
            });

            // Then we will disable all anchor tags to prevent accidental navigation while editing
            setTimeout(() => {
               document.querySelectorAll("a").forEach((a) => {
                  a.href = "javascript:void(0)";
                  a.removeAttribute("download");
               });
            }, 1500);

            /**
             * Then we will initialize the global editor from the parent window,
             * since this script is running inside an iframe and the editor lives outside of it
             */
            window.parent?.MembershipEditor?.initializers?.initializeGlobalContents();

            // Finally we will attach the main click listener to detect interactions with editable elements
            window.addEventListener("click", (e) => {
               /**
                * We will check if the clicked element or any of its parent elements
                * contains the data-editable attribute.
                * If it does, we will open the editor for that element.
                */
               const editableElement = e.target.closest("[data-editable]");
               if (editableElement) {
                  const key = editableElement.getAttribute("data-editor-key");
                  window.parent.MembershipEditor.initializers.initializeElementEditor(
                     key,
                     `[data-editor-key='${key}']`,
                  );
               }
            });
         },
      };

      // Data module
      data = {
         // This helper method retrieves the editable page names and URLs
         getListOfEditablePages: async () => {
            // First, we will retrieve the template schema inside the preview iframe
            const templateSchema = window.templateCustomizationSchema;

            // Then, we will request to retrieve the categories inside the course template
            const categoriesWithPost = await window.CourseTemplate.data.fetchCategories();

            // Then, we will retrieve the productId, valid category ID, and valid post ID
            const categoryWithValidPosts = [...categoriesWithPost]
               .filter((cat) => !cat.parentCategory)
               .sort((a, b) => {
                  const hasMedia = (cat) =>
                     cat.posts?.some(
                        (p) => p.video !== null || p.audio !== null || !!p.embedJson,
                     );
                  if (hasMedia(a) && !hasMedia(b)) return -1;
                  if (!hasMedia(a) && hasMedia(b)) return 1;
                  return (a.sequenceNo || 0) - (b.sequenceNo || 0);
               })[0];
            const productId = categoryWithValidPosts?.["productId"];
            const categoryId = categoryWithValidPosts?.["id"];

            const postId = (() => {
               const rawPosts = categoryWithValidPosts?.posts || [];
               return [...rawPosts].sort((a, b) => {
                  const aHasMedia = a.video !== null || a.audio !== null || !!a.embedJson;
                  const bHasMedia = b.video !== null || b.audio !== null || !!b.embedJson;
                  if (aHasMedia && !bHasMedia) return -1;
                  if (!aHasMedia && bHasMedia) return 1;
                  return (a.sequenceNo || 0) - (b.sequenceNo || 0);
               })[0]?.id;
            })();

            // Then, we will create a function that will hydrate the GHL URL regex
            const hydrateGhlUrl = (urlRegex, pId, cId = null, poId = null) => {
               const currentUrl = new URL(window.location.href);
               let path = urlRegex.replace(/\\/g, "").replace(/\(\?.*\)\?\$$/, "");
               if (pId) path = path.replace("[^/]+", pId);
               if (cId) path = path.replace("[^/]+", cId);
               if (poId) path = path.replace("[^/]+", poId);
               const finalUrl = new URL(path, window.location.origin);
               currentUrl.searchParams.forEach((value, key) => {
                  finalUrl.searchParams.set(key, value);
               });
               return finalUrl.href;
            };

            // Then, we will retrieve the pages from the template schema based on the window size
            const isDesktop = window.matchMedia("(min-width: 768px)").matches;
            const pages = templateSchema[isDesktop ? "pages" : "mobilePages"];

            // Then, we will format the pages and return them
            const allPages = pages.map((page) => {
               const fullUrl = hydrateGhlUrl(
                  page.urlRegex,
                  productId,
                  categoryId,
                  postId,
               );
               const isActive = (() => {
                  const currentRegex = new RegExp(page.urlRegex);
                  if (!currentRegex.test(location.pathname)) return false;
                  const segmentCount = (regex) => (regex.match(/\//g) || []).length;
                  const hasBetterMatch = pages.some((otherPage) => {
                     if (otherPage.name === page.name) return false;
                     const otherRegex = new RegExp(otherPage.urlRegex);
                     return (
                        otherRegex.test(location.pathname) &&
                        segmentCount(otherPage.urlRegex) > segmentCount(page.urlRegex)
                     );
                  });
                  return !hasBetterMatch;
               })();
               return { name: page.name, url: fullUrl, isActive };
            });
            return allPages;
         },
      };

      // Utils module
      utils = {
         // This helper method retrieves the auth information
         getAuth: async () => {
            return new Promise((res) => {
               const interval = setInterval(() => {
                  if (
                     document.querySelector(".product-container, #app-container") &&
                     window?.$cookies
                  ) {
                     const acatToken = window?.$cookies?.get("acat");
                     const catToken = window?.$cookies?.get("cat");
                     const data = JSON.parse(window.atob(catToken || acatToken) || "{}");
                     if (!("productId" in data)) {
                        const url = location.href
                           ?.split("/products/")[1]
                           .split("/")[0]
                           .split("?")[0];
                        data.productId = url;
                     }
                     if (!("tokenId" in data)) {
                        data.tokenId = data.token;
                     }
                     clearInterval(interval);
                     res(data);
                  }
               }, 0);
            });
         },
      };
   }

   class MembershipParser {
      constructor() {
         // First, we define the available templates along with their metadata, such as IDs, preview images, and script sources.
         this.templates = [];
         this.originalTemplateCustomizationSchema = null;
         this.activeTemplate = null;
         this.activePageOnTemplate = null;
         this.isEdit = location.href.includes("membershipeditor=true");
         this.isPreviewEditor = location.href.includes("isEditorPreview=true");
         this.isDesktop = window.matchMedia("(min-width: 768px)").matches;

         // Then we will check if we are in edit mode, we stop the constructor here to prevent redundant initialization.
         if (this.isEdit) return;

         // Finally, we start the process of initializing the application and fetching the client's active templates.
         (async () => {
            // First, we retrieve the client's available templates from the remote source.
            await fetch(
               `https://membershipeditor.netlify.app/src/clientTemplates/${window.MEMBERSHIP_CUSTOMIZER_CLIENT_ID}/templates.json`,
               {
                  priority: "high",
               },
            )
               ?.then((e) => e.json())
               ?.then((e) => {
                  this.templates = e;
               });

            // Then, we retrieve any saved template changes from media storage and inject them into the document.
            if (window?.savedTemplatesFileInfo?.url) {
               await fetch(window?.savedTemplatesFileInfo?.url, {
                  priority: "high",
               })
                  ?.then((e) => e.text())
                  ?.then((e) => {
                     const script = document.createElement("script");
                     script.innerHTML = e;
                     document.body.append(script);
                     return e;
                  });
            }

            /**
             * Then, we determine the currently active template by searching through the saved configurations.
             * We dynamically load its corresponding script, falling back to the first available template
             * if no active configuration is found.
             */
            const savedTemplates = window?.activeTemplatesConfig || [];
            const activeTemplateFromSavedTemplates = savedTemplates.find(
               (tem) => tem.isActive,
            );
            const currentTemplate = this.templates.find(
               (tem) => tem.id === activeTemplateFromSavedTemplates?.id,
            );
            const script = document.createElement("script");
            script.src = (
               currentTemplate ? currentTemplate : this.templates[0]
            )?.scriptLink;
            document.body.append(script);

            /**
             * Finally, once the template script has finished loading, we initialize the active template configuration,
             * resolve the default page editor state, and trigger the application initialization sequence.
             */
            script.onload = () => {
               // First we will assign the this.originalTemplateCustomizationSchema to the current templates schema so that we have a clean copy of template schema
               this.originalTemplateCustomizationSchema = window._.cloneDeep(
                  window?.templateCustomizationSchema,
               );

               // Then, we initialize the active template by merging saved data with the Master Schema where IDs match.
               this.activeTemplate = (() => {
                  if (activeTemplateFromSavedTemplates?.id) {
                     if (
                        activeTemplateFromSavedTemplates?.id ===
                        window?.templateCustomizationSchema?.id
                     ) {
                        const savedMergeValueKeys = [
                           "value",
                           "isTurnedOn",
                           "customCss",
                           "placeholderThumbnail",
                        ];
                        const getArrayItemIdentity = (item = {}) => {
                           if (!item || typeof item !== "object") return "";
                           if (item.key) return `key:${item.key}`;
                           if (item.property) return `property:${item.property}`;
                           if (item.type && item.target) {
                              return `type-target:${item.type}:${item.target}`;
                           }
                           if (item.urlRegex) return `urlRegex:${item.urlRegex}`;
                           if (item.name) return `name:${item.name}`;
                           if (item.label) return `label:${item.label}`;
                           return "";
                        };
                        const findSavedArrayItem = (
                           masterItem,
                           savedItems = [],
                           index = 0,
                        ) => {
                           const identity = getArrayItemIdentity(masterItem);
                           if (!identity) return savedItems[index];
                           return savedItems.find(
                              (savedItem) => getArrayItemIdentity(savedItem) === identity,
                           );
                        };
                        const isPrimitiveArray = (items = []) => {
                           return items.every(
                              (item) => item === null || typeof item !== "object",
                           );
                        };

                        /**
                         * First we strip deprecated saved data against the current master schema.
                         * Arrays are aligned to the master schema order so _.mergeWith cannot
                         * merge old saved items back in by index. Empty schema arrays
                         * and primitive arrays are treated as user data arrays and kept as-is.
                         */
                        const stripDeprecated = (
                           masterValue,
                           savedValue,
                           allowUnknownKeys = false,
                        ) => {
                           if (Array.isArray(masterValue)) {
                              if (!Array.isArray(savedValue)) return undefined;
                              if (!masterValue.length || isPrimitiveArray(masterValue)) {
                                 return window._.cloneDeep(savedValue);
                              }
                              return masterValue.map((masterItem, index) => {
                                 const savedItem = findSavedArrayItem(
                                    masterItem,
                                    savedValue,
                                    index,
                                 );
                                 if (savedItem === undefined) {
                                    return window._.cloneDeep(masterItem);
                                 }
                                 return stripDeprecated(masterItem, savedItem);
                              });
                           }

                           if (
                              masterValue &&
                              savedValue &&
                              typeof masterValue === "object" &&
                              typeof savedValue === "object"
                           ) {
                              const result = window._.cloneDeep(savedValue);
                              Object.keys(result).forEach((key) => {
                                 if (!(key in masterValue)) {
                                    if (!allowUnknownKeys) delete result[key];
                                    return;
                                 }
                                 result[key] = stripDeprecated(
                                    masterValue[key],
                                    result[key],
                                 );
                              });
                              return result;
                           }

                           return savedValue;
                        };
                        const cleanedSaved = stripDeprecated(
                           window.templateCustomizationSchema,
                           activeTemplateFromSavedTemplates,
                           true,
                        );

                        /**
                         * Finally use _.mergeWith to ensure that structural fixes in our Master Schema
                         * are applied while preserving the specific values entered by the user.
                         */
                        return window?._?.mergeWith(
                           // We clone the schema to avoid mutating the "Master" object in memory.
                           window._.cloneDeep(window?.templateCustomizationSchema),
                           cleanedSaved,
                           (objectValue, srcValue, key) => {
                              // --- STEP 1: USER DATA OVERWRITES ---
                              // Prioritize saved user data for specific visual properties.
                              if (savedMergeValueKeys.includes(key)) {
                                 return srcValue;
                              }

                              // Data arrays do not have schema items to align, so saved data should win automatically.
                              if (
                                 Array.isArray(objectValue) &&
                                 Array.isArray(srcValue) &&
                                 (!objectValue.length || isPrimitiveArray(objectValue))
                              ) {
                                 return srcValue;
                              }

                              // --- STEP 2: RECURSIVE DRILLING ---
                              // If the property is an Object or Array, we return undefined to continue merging deeper.
                              if (window._.isObject(objectValue)) {
                                 return undefined;
                              }

                              // --- STEP 3: SCHEMA PROTECTION ---
                              // For structural properties, we prioritize the Master Schema to ensure code updates take effect.
                              return objectValue;
                           },
                        );
                     } else {
                        return window.templateCustomizationSchema;
                     }
                  } else {
                     return window.templateCustomizationSchema;
                  }
               })();

               // Then, we select the default page editor configuration based on the device type (Desktop or Mobile).
               this.activePageOnTemplate =
                  this.activeTemplate?.[
                     this.isDesktop ? "pages" : "mobilePages"
                  ][0]?.editor;

               // Then we will sync the template customization schema to the global scope
               window.templateCustomizationSchema = this.activeTemplate;

               // Finally, we invoke the main application initializer.
               this.initializers.init();
            };
         })();
      }

      // Initializer module
      initializers = {
         // This method serves as the entry point for the application initialization
         init: () => {
            this.initializers.initSyncConfig();
         },

         // This method is responsible for synchronizing the CSS, element, and feature customizations in a single execution
         initSyncConfig: (immediateSync = false) => {
            // First we will retrieve the current URL to determine which page configuration should be applied
            const url = window.location.href;

            // Then we will sync the template's custom CSS so base styles are applied before other customizations
            this.actions.syncTemplateCustomCss();

            // Then we will sync the template's used google fonts
            this.actions.syncTemplateGoogleFontsUsed();

            // Then we will sync the template's custom fonts
            this.actions.syncTemplateCustomFonts();

            // Then we will sync the template's branding styles
            this.actions.syncTemplateBrandingCss();

            // Finally we will iterate through the template pages to find the current view and process it
            this.activeTemplate?.[this.isDesktop ? "pages" : "mobilePages"]?.forEach(
               (page) => {
                  /**
                   * First we will create a RegExp instance using the page's URL pattern.
                   * This allows us to support dynamic route matching instead of exact URL comparison.
                   */
                  const urlRegex = new RegExp(page?.urlRegex);

                  /**
                   * Finally we will check if the current URL matches the pattern.
                   * If it does, we proceed with applying the corresponding page configuration.
                   */
                  if (urlRegex?.test(url)) {
                     // First we will update the active page state with the editor configuration that matches the current URL
                     this.activePageOnTemplate = page.editor;

                     // Then we will invoke all synchronizers to apply CSS and element-level customizations for this page
                     this.actions.syncTemplateCssCustomizations();
                     this.actions.syncTemplateElementsCustomization();

                     /**
                      * Then we will delay feature customizations to ensure the DOM
                      * and previous customizations are fully applied before executing
                      */
                     setTimeout(
                        () => {
                           this.actions.syncTemplateFeatureCustomizations(
                              null,
                              null,
                              true,
                           );
                        },
                        immediateSync ? 0 : 5500,
                     );

                     /**
                      * Finally we will initialize the membership preview after a short delay.
                      * This ensures all required elements and configurations are ready
                      * before activating preview mode
                      */
                     setTimeout(() => {
                        if (this.isPreviewEditor && !immediateSync) {
                           if (!window.MembershipPreview) {
                              window.MembershipPreview = new MembershipPreview();
                           }
                        }
                     }, 2000);
                  }
               },
            );
         },
      };

      // Action module
      actions = {
         // This method applies the template's custom css
         syncTemplateCustomCss: () => {
            // First we will remove any previously rendered style tags
            document
               ?.querySelectorAll(".bm-template-custom-style")
               ?.forEach((e) => e.remove());

            // Then we will generate the Custom JS Style Tag
            const customCssStyleTagHTML = `
               <style class="bm-template-custom-style">${this.activeTemplate["customCss"]}</style>
            `;

            // Finally we will insert the fresh style tags with the updated CSS values
            document.body.insertAdjacentHTML("beforeend", `${customCssStyleTagHTML}`);
         },

         // This method applies the template's branding css
         syncTemplateBrandingCss: () => {
            // First we will remove any previously rendered style tags
            document
               ?.querySelectorAll(".bm-template-branding-style")
               ?.forEach((e) => e.remove());

            // Then we will generate the Custom JS Style Tag
            const brandingCssStyleTagHTML = (() => {
               const branding = this.activeTemplate.branding
                  ?.flatMap((brandingItem) => brandingItem.customizations)

         // This method applies the template's Google Fonts used
         syncTemplateGoogleFontsUsed: () => {

         },

         // This method applies the template's Custom Fonts
         syncTemplateCustomFonts: () => {
            // First we will remove any previously rendered font style tags
            document
               ?.querySelectorAll(".bm-template-custom-fonts")
               ?.forEach((e) => e.remove());

            // Then we will generate the Custom Fonts style tag HTML
            const customFontsStyleHTML = `
               <style class="bm-template-custom-fonts">
                  ${this.activeTemplate?.customFonts?.reduce((a, c) => {
                     a += `@font-face { font-family: '${c.name}'; src: url('${c.url}')}`;

            // Finally we will insert the fresh style tag with the updated CSS values
            document.body.insertAdjacentHTML("beforeend", `${customFontsStyleHTML}`);
         },

         // This method applies all CSS customizations from the activePageOnTemplate into the page
         syncTemplateCssCustomizations: () => {
            // First we will remove any previously rendered style tags
            document?.querySelectorAll(".bm-template-style")?.forEach((e) => e.remove());

            // Then we will generate the HTML strings for both the active page and global styles
            const commonTemplateStyles = (() => {
               return `
                  <style class="bm-template-style">
                  ${this.activePageOnTemplate.reduce((a, c) => {
                     a += `
                      ${c.elementSelector} {
                      ${c.cssCustomizations.reduce((ac, cc) => {
                         const important = cc?.important ? "!important" : "";
                         if (cc.value) {
                            ac += `${cc.property}: ${cc.property === "background-image" ? `url(${cc.value})` : cc.value} ${important};`;
                         }
                         return ac;
                      }, "")}
                      }
                      `;
                     return a;
                  }, "")}
                  </style>
               `;
               return "";
            })();
            const globalTemplateStyles = (() => {
               return `
               <style class="bm-template-style">
                  ${this.activeTemplate.global?.reduce((a, c) => {
                     c.customizations?.forEach((gCustomizations) => {
                        a += `
                              ${gCustomizations?.elementSelector} {
                                  ${gCustomizations?.cssCustomizations?.reduce(
                                     (ac, cc) => {
                                        if (cc.value) {
                                           const important = cc?.important
                                              ? "!important"
                                              : "";
                                           ac += `${cc.property}: ${cc.property === "background-image" ? `url(${cc.value})` : cc.value} ${important};`;
                                        }
                                        return ac;
                                     },
                                     "",
                                  )}
                              }
                              `;
                     });
                     return a;
                  }, "")}
               </style>
               `;
            })();

            // Finally we will insert the fresh style tags with the updated CSS values
            document?.body?.insertAdjacentHTML(
               "beforeend",
               `${commonTemplateStyles}${globalTemplateStyles}`,
            );
         },

         // This method syncs all element customizations to the actual DOM elements
         syncTemplateElementsCustomization: () => {
            /**
             * First we will loop through the activePageOnTemplate because each template
             * element may have its own customizations that need to be applied.
             */
            this.activePageOnTemplate.forEach((item) => {
               if (item?.elementCustomizations?.length) {
                  /**
                   * We will apply each customization, either as an attribute update
                   * or an HTML content update depending on its type.
                   */
                  item.elementCustomizations.forEach((elItem) => {
                     if (elItem?.type === "attribute") {
                        this.utils.whenElementReady(item.elementSelector, () => {
                           const currentAttributeValue = document
                              ?.querySelector(item.elementSelector)
                              ?.getAttribute(elItem.target);
                           const value = elItem.value || currentAttributeValue;
                           elItem.value = value;
                           document
                              ?.querySelector(item.elementSelector)
                              ?.setAttribute(elItem.target, value);
                        });
                     } else if (elItem.type === "html") {
                        this.utils.whenElementReady(item.elementSelector, () => {
                           const currentHTML = document.querySelector(
                              item.elementSelector,
                           ).innerHTML;
                           const value = elItem.value || currentHTML;
                           elItem.value = value;
                           document.querySelector(item.elementSelector).innerHTML = value;
                        });
                     }
                  });
               }
            });

            /**
             * Finally we will iterate through the global template settings to apply
             * any shared element customizations to their respective targets.
             */
            this.activeTemplate.global.forEach((item) => {
               item.customizations.forEach((cItem) => {
                  if (cItem?.elementCustomizations?.length) {
                     cItem.elementCustomizations.forEach((elementCustomizationI) => {
                        if (elementCustomizationI?.type === "attribute") {
                           this.utils.whenElementReady(cItem.elementSelector, () => {
                              const currentAttributeValue = document
                                 ?.querySelector(cItem.elementSelector)
                                 ?.getAttribute(elementCustomizationI.target);
                              const value =
                                 elementCustomizationI.value || currentAttributeValue;
                              elementCustomizationI.value = value;
                              document
                                 ?.querySelector(cItem.elementSelector)
                                 ?.setAttribute(elementCustomizationI.target, value);
                           });
                        } else if (elementCustomizationI.type === "html") {
                           this.utils.whenElementReady(cItem.elementSelector, () => {
                              const currentHTML = document.querySelector(
                                 cItem.elementSelector,
                              ).innerHTML;
                              const value = elementCustomizationI.value || currentHTML;
                              elementCustomizationI.value = value;
                              document.querySelector(cItem.elementSelector).innerHTML =
                                 value;
                           });
                        }
                     });
                  }
               });
            });
         },

         // This method re-syncs a feature by re-inserting its CSS and JS
         syncTemplateFeatureCustomizations: (
            normal = { templateItemKey: "", featureKey: "" },
            global = { name: "", templateItemKey: "", featureKey: "" },
            forceSync = false,
         ) => {
            // First we will initialize placeholders for the items we need to find
            let templateItem = null;
            let featureItem = null;

            // Then we will define a helper function to handle the actual DOM manipulation (Cleanup -> Removal -> Injection)
            const syncFeature = (templateItemKey = "", featureKey = "") => {
               // First we will run the cleanup script to reset any previous states before removing the feature
               const scriptTagCleanUp = document.createElement("script");
               scriptTagCleanUp.id = `${templateItemKey}-${featureKey}`;
               scriptTagCleanUp.innerHTML = featureItem.cleanUpJs(
                  featureItem.customizations,
               );
               document.body.append(scriptTagCleanUp);
               setTimeout(() => {
                  scriptTagCleanUp.remove();
               }, 500);

               // Then we will remove the existing feature style and script tags from the DOM
               document
                  .querySelector(`style[id = '${templateItemKey}-${featureKey}']`)
                  ?.remove();
               document
                  .querySelector(`script[id = '${templateItemKey}-${featureKey}']`)
                  ?.remove();

               // Then we will re-insert the fresh style tag with the updated CSS
               document.body.insertAdjacentHTML(
                  "beforeend",
                  `
                     <style id="${templateItemKey}-${featureKey}">
                         ${featureItem.css(featureItem.customizations)}
                     </style>
                  `,
               );

               // Finally we will re-insert the fresh script tag with the updated JavaScript
               const scriptTag = document.createElement("script");
               scriptTag.id = `${templateItemKey}-${featureKey}`;
               scriptTag.innerHTML = featureItem.js(featureItem.customizations);
               document.body.append(scriptTag);
            };

            // Then if a forced synchronization is requested, we will proceed to update all active features across the entire template
            if (forceSync) {
               // First we will iterate through the global configuration to identify and sync every feature found within the global customization settings
               this.activeTemplate.global.forEach((e) => {
                  e.customizations.forEach((eC) => {
                     if (eC.features && eC.features?.length) {
                        eC.features.forEach((fI) => {
                           if (fI.isTurnedOn) {
                              featureItem = fI;
                              syncFeature(eC.key, fI.key);
                           }
                        });
                     }
                  });
               });

               // Then we will also iterate through the currently active page's elements to sync their specific features, completing the full refresh
               this.activePageOnTemplate.forEach((e) => {
                  if (e.features && e.features?.length) {
                     e.features.forEach((fI) => {
                        if (fI.isTurnedOn) {
                           featureItem = fI;
                           syncFeature(e.key, fI.key);
                        }
                     });
                  }
               });

               // Finally we will return empty value to prevent the execution of the code below
               return;
            }

            // Finally, depending on whether it is a global or normal update, we will determine the correct context and process the feature sync
            if (!global.featureKey) {
               // First, if it is a normal update, we will retrieve the template item and the specific feature directly from the active page configuration
               templateItem = this.activePageOnTemplate.find(
                  (item) => item.key === normal.templateItemKey,
               );
               featureItem = templateItem.features.find(
                  (fI) => fI.key === normal.featureKey,
               );

               // Finally, we will invoke the helper to apply the changes to the DOM
               syncFeature(normal.templateItemKey, normal.featureKey);
            } else {
               // First, otherwise if this is a global update, we will retrieve the target items from the global settings configuration
               templateItem = this.activeTemplate.global
                  .find((item) => item.name === global.name)
                  .customizations.find((item) => item.key === global.templateItemKey);
               featureItem = templateItem.features.find(
                  (fI) => fI.key === global.featureKey,
               );

               // Finally, we will invoke the helper to apply the global changes to the DOM
               syncFeature(global.templateItemKey, global.featureKey);
            }
         },
      };

      // Utils module
      utils = {
         whenElementReady: (
            selector,
            callback,
            { timeoutMs = 7000, root = document.documentElement, once = true } = {},
         ) => {
            // First we will initialize our state variables to track the observation status
            let done = false;
            let observer = null;
            let timeout = null;

            // Then we will define the check function that verifies if the element exists and executes the callback
            const apply = () => {
               if (done) return;
               const el = document.querySelector(selector);
               if (!el) return false;
               callback(el);
               if (once) {
                  done = true;
                  observer?.disconnect();
                  clearTimeout(timeout);
               }
               return true;
            };

            // Then we will initialize the MutationObserver and start observing the root element for changes
            observer = new MutationObserver(apply);
            observer.observe(root, { childList: true, subtree: true });

            // Then we will also set a fallback timeout to stop observing if the element never appears
            timeout = setTimeout(() => {
               observer.disconnect();
            }, timeoutMs);

            // Then we will attempt an immediate check in case the element is already present in the DOM
            apply();

            // Finally return a cleanup function to allow the caller to cancel the observation manually
            return () => {
               done = true;
               observer.disconnect();
               clearTimeout(timeout);
            };
         },
         // This helper method retrieves the auth information
         getAuth: async () => {
            return new Promise((res) => {
               const interval = setInterval(() => {
                  if (
                     document.querySelector(".product-container, #app-container") &&
                     window?.$cookies
                  ) {
                     const acatToken = window?.$cookies?.get("acat");
                     const catToken = window?.$cookies?.get("cat");
                     const data = JSON.parse(window.atob(catToken || acatToken) || "{}");
                     if (!("productId" in data)) {
                        const url = location.href
                           ?.split("/products/")[1]
                           .split("/")[0]
                           .split("?")[0];
                        data.productId = url;
                     }
                     if (!("tokenId" in data)) {
                        data.tokenId = data.token;
                     }
                     clearInterval(interval);
                     res(data);
                  }
               }, 0);
            });
         },
      };
   }

         // This method handles enabling/disabling a feature
         toggleTemplateFeature: (
            normal = {
               templateItemKey: "",
               featureKey: "",
               isTurnedOn: false,
            },
            global = {
               name: "",
               templateItemKey: "",
               featureKey: "",

            const activePageOnTemplate =
               previewIframeMembershipParser.activePageOnTemplate;
            const activeTemplate = previewIframeMembershipParser.activeTemplate;

            // Then we will save the current template snapshot to undoStack
            this.actions.saveTemlplateSnapshotToUndoStack();

            // Then we will initialize placeholders for the items we need to find
            let templateItem = null;
            let featureItem = null;

            // Then we will create a  helper function handles the actual DOM manipulation (CSS/JS injection)
            const toggleFeature = (
               isTurnedOn = false,
               templateItemKey = "",
               featureKey = "",
            ) => {
               if (isTurnedOn) {
                  // First we will insert the feature's styles
                  this.$iframe.contentDocument.body.insertAdjacentHTML(
                     "beforeend",
                     `
                           <style id="${templateItemKey}-${featureKey}">
                               ${featureItem.css(featureItem.customizations)}
                           </style>
                       `,
                  );

                  // Finally we will insert and execute the feature's JavaScript
                  const scriptTag = this.$iframe.contentDocument.createElement("script");
                  scriptTag.id = `${templateItemKey}-${featureKey}`;
                  scriptTag.innerHTML = featureItem.js(featureItem.customizations);
                  this.$iframe.contentDocument.body.append(scriptTag);
               } else {
                  // First we will remove the previous styles and script tags
                  this.$iframe.contentDocument
                     .querySelector(`style[id = '${templateItemKey}-${featureKey}']`)
                     ?.remove();
                  this.$iframe.contentDocument
                     .querySelector(`script[id = '${templateItemKey}-${featureKey}']`)
                     ?.remove();

                  // Finally we will run the cleanup script to reset any side effects
                  const scriptTag = this.$iframe.contentDocument.createElement("script");
                  scriptTag.id = `${templateItemKey}-${featureKey}`;
                  scriptTag.innerHTML = featureItem.cleanUpJs(featureItem.customizations);
                  this.$iframe.contentDocument.body.append(scriptTag);
                  setTimeout(() => {
                     scriptTag.remove();
                  }, 500);
               }
            };

            // Finally depends if it is a global or normal update we will process the feature toggle accordingly
            if (!global.featureKey) {
               // First if it is a normal update, we will retrieve the template item and the specific feature from the active page
               templateItem = activePageOnTemplate.find(
                  (item) => item.key === normal.templateItemKey,
               );
               featureItem = templateItem.features.find(
                  (fI) => fI.key === normal.featureKey,
               );

               // Then we will update the feature's isTurnedOn state in the data structure
               activePageOnTemplate.forEach((item) => {
                  if (item.key === normal.templateItemKey) {
                     item.features.forEach((fI) => {
                        if (fI.key === normal.featureKey) {
                           fI.isTurnedOn = normal.isTurnedOn;
                        }
                     });
                  }
               });

               // Finally we will invoke the helper to apply the changes to the DOM
               toggleFeature(
                  normal.isTurnedOn,
                  normal.templateItemKey,
                  normal.featureKey,
               );
            } else {
               // First otherwise if this is a global update, we will retrieve the items from the global settings
               templateItem = activeTemplate.global
                  .find((item) => item.name === global.name)
                  .customizations.find((item) => item.key === global.templateItemKey);
               featureItem = templateItem.features.find(
                  (fI) => fI.key === global.featureKey,
               );

               // Then we will update the feature's isTurnedOn state in the global data structure
               activeTemplate.global.forEach((item) => {
                  if (item.name === global.name) {
                     item.customizations.forEach((cItem) => {
                        if (cItem.key === global.templateItemKey) {
                           cItem.features.forEach((fI) => {
                              if (fI.key === global.featureKey) {
                                 fI.isTurnedOn = global.isTurnedOn;
                              }
                           });
                        }
                     });
                  }
               });

               // Finally we will invoke the helper to apply the global changes to the DOM
               toggleFeature(
                  global.isTurnedOn,
                  global.templateItemKey,
                  global.featureKey,
               );
            }
         },

                        "Content-Type": "application/json",
                        "token-id": auth?.tokenId,
                     },
                     priority: "high",
                     body: JSON.stringify({
                        name: imageName,
                        contentType: contentType,
                        parentId: parentFolder,
                        altType: "location",
                        altId: String(locationId),
                        size: size,
                        mode: "public",
                     }),
                  },
               );
               if (!registerResponse.ok) {
                  throw new Error(`Image register failed: ${registerResponse.status}`);
               }
               const registerJSON = await registerResponse.json();
               if (!registerJSON?.url || !registerJSON?.aknId) {
                  throw new Error("Image register response is missing upload data");
               }
               const uploadResponse = await fetch(registerJSON.url, {
                  method: "PUT",
                  headers: {
                     "Content-Type": contentType,
                  },
                  priority: "high",
                  body: blob,
               });
               if (!uploadResponse.ok) {
                  throw new Error(`Image file upload failed: ${uploadResponse.status}`);
               }
               const validateResponse = await fetch(
                  "https://services.leadconnectorhq.com/medias/files/verify",
                  {
                     method: "POST",
                     headers: {
                        "Version": "2021-07-28",
                        "Source": "WEB_USER",

                     body: JSON.stringify({

                     }),
                  },
               );
               if (!validateResponse.ok) {

               }

                  altType: validateJSON.altType,
                  name: validateJSON.name,
                  url: validateJSON.url,
                  size: validateJSON.size,

         multiInput: (templateKey, property, value = "", onChange = () => {}) => {
            // First we will create a helper function to interpret a CSS spacing string (e.g. "10px 20px")
            const parseValue = (val) => {
               if (!val || val.trim() === "0")
                  return { top: "", right: "", bottom: "", left: "", all: "" };
               const parts = val
                  .split(/\s+/)
                  .filter((v) => v.trim() !== "" && v.trim() !== "0");
               if (parts.length === 1)
                  return { top: "", right: "", bottom: "", left: "", all: parts[0] };
               if (parts.length === 2)
                  return {
                     top: parts[0],
                     right: parts[1],
                     bottom: parts[0],
                     left: parts[1],
                     all: "",
                  };
               if (parts.length === 3)
                  return {
                     top: parts[0],
                     right: parts[1],
                     bottom: parts[2],
                     left: parts[1],
                     all: "",
                  };
               if (parts.length >= 4)
                  return {
                     top: parts[0],
                     right: parts[1],
                     bottom: parts[2],
                     left: parts[3],
                     all: "",
                  };
               return { top: "", right: "", bottom: "", left: "", all: "" };
            };

            // Then we will parse initial incoming value (for pre-filling inputs)
            const { top, right, bottom, left, all } = parseValue(value);

            // Then we will create a listener for ANY input change inside the widget
            const listenerId = `${templateKey}-${property}`;
            const listenerFunction = (e) => {
               // First we will retrieve the closest multi input widget
               const $targetElement = e.target.closest(`.widget-multi-input`);

               // Finally if there is a closest multi input widget then we will process the input
               if ($targetElement) {
                  // First we will retrieve the widget template key and property
                  const widgetTemplateKey =
                     $targetElement.getAttribute("data-template-key");
                  const widgetProperty = $targetElement.getAttribute("data-property");

                  // Finally we will only update if this widget matches the expected template + property
                  if (widgetTemplateKey === templateKey && widgetProperty === property) {
                     // First we will retrieve the  input side and the input value
                     const inputSide = e.target.getAttribute("data-side");
                     const inputValue = e.target.value;

                     // Then if the input side is "all", we will mirror it's value to all of the input
                     if (inputSide === "all") {
                        Array.from($targetElement.querySelectorAll("input"))
                           ?.filter((e) => e.getAttribute("data-side") !== "all")
                           ?.forEach((e) => {
                              e.value = inputValue;
                           });
                     }

                     // Then we will build final CSS value string: "top right bottom left"
                     const finalValue = ["top", "right", "bottom", "left"].reduce(
                        (a, c) => {
                           const value =
                              $targetElement.querySelector(`input[data-side=${c}]`)
                                 ?.value || 0;
                           a += `${value}px `;
                           return a;
                        },
                        "",
                     );

                     // Finally we will invoke the passed onchange value
                     onChange?.(finalValue);
                  }
               }
            };
            if (!window._multiInputListeners) {
               window._multiInputListeners = {};
            }
            if (listenerId in window?._multiInputListeners) {
               window.removeEventListener(
                  "change",
                  window._multiInputListeners[listenerId],
               );
            }
            window.addEventListener("change", listenerFunction);
            window._multiInputListeners[listenerId] = listenerFunction;

            // Finally return the actual HTML for the widget
            return `
               <div class="widget-multi-input" data-template-key="${templateKey}" data-property="${property}">
                   <input type="number" placeholder="Top" data-side="top" value="${top.replace("px", "")}">
                   <input type="number" placeholder="Right" data-side="right" value="${right.replace("px", "")}">
                   <input type="number" placeholder="Bottom" data-side="bottom" value="${bottom.replace("px", "")}">
                   <input type="number" placeholder="Left" data-side="left" value="${left.replace("px", "")}">
                   <input type="number" placeholder="All" data-side="all" value="${all.replace("px", "")}">
               </div>
             `;
         },

                           const googleFontsUsed = filteredChunk

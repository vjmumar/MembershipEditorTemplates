                           "customFonts"
                        ]?.reduce((a, c) => {
                           a += `<li style="font-family: ${c?.name}" class="widget-font-select__item" onmousedown="(function(){const $i = document.getElementById('${templateKey}${property}');$i.value = '${c?.name}';$i.setAttribute('data-type', 'custom');$i.dispatchEvent(new Event('input', { bubbles: true }));})();">${c.name}</li>`;
                           return a;
                        }, ``);

                     // Finally we will return the options
                     return optionsHTML ? `<p>Custom Fonts</p>${optionsHTML}` : "";
                  })();

                  // Finally we will replace the select list inner HTML with the new filtered options
                  $selectList.innerHTML = `
                     <li class="widget-font-select__item" onmousedown="(function(){const $i = document.getElementById('${templateKey}${property}');$i.value = '';$i.setAttribute('data-type', 'custom');$i.dispatchEvent(new Event('input', { bubbles: true }));})();">Select</li>
                     ${customFontsOptionsHTML}
                     ${gFontsOptionsHTML}
                  `;
               });
            };

            // Then we will create a listener for ANY input change inside the widget
            const listenerId = `${templateKey}-${property}`;
            const listenerFunction = (e) => {
               const $targetElement = e.target;
               // First we will listen for the select option list input change and filter the options
               if (
                  $targetElement.classList.contains(`${templateKey}${property}-search`)
               ) {
                  showFontSelectOptions(e.target.value);
               }

               // Finally we will listen for changes in the hidden input inside the select where we store the selected option value
               if (
                  $targetElement.classList.contains(`editor-customizer-form__item__input`)
               ) {
                  const widgetTemplateKey =
                     $targetElement.getAttribute("data-template-key");
                  const widgetProperty = $targetElement.getAttribute(
                     "data-template-property",
                  );
                  if (widgetTemplateKey === templateKey && widgetProperty === property) {
                     // First we will retrieve the data type e.g(google, custom)
                     const type = e.target.getAttribute("data-type");

                     // Then we will update the value and font family of the search input
                     const $filterInput = document.querySelector(
                        `.${templateKey}${property}-search`,
                     );
                     $filterInput.value = e.target.value;
                     $filterInput.style.fontFamily = e.target.value;

                     // Finally we will invoke the onChange callback
                     onChange?.({
                        name: e.target.value,
                        type,
                     });
                  }
               }
            };

            // Then we will manage the event listeners using a global registry to prevent duplication
            if (!window._input) {
               window._input = {};
            }
            if (listenerId in window?._input) {
               window.removeEventListener("input", window._input[listenerId]);
            }
            window.addEventListener("input", listenerFunction);
            window._input[listenerId] = listenerFunction;

            // Then we will initialize the font select options
            showFontSelectOptions();

            // Finally we will return the font selection HTML
            return `
               <div class="widget-font-select ${templateKey}${property}-select">
                   <input type="text" value="${value}" style="font-family: ${value}" class="widget-font-select__input ${templateKey}${property}-search" placeholder="${value || `Search fonts...`}" autocomplete="off">
                   <ul class="widget-font-select__list ${templateKey}${property}-list">
                       <li class="widget-font-select__item" data-value="">Loading...</li>
                   </ul>
                   <input type="hidden" data-template-key=${templateKey} data-template-property=${property} id="${templateKey}${property}" name="font_family" class="widget-font-select__value editor-customizer-form__item__input" >
               </div>
            `;
         },
         withToolTip: (html = "", label = "") => {
            if (!document.__tooltipListenersAttached) {
               document.__tooltipListenersAttached = true;
               document.addEventListener("mouseover", (e) => {
                  const trigger = e.target.closest(".widget-tooltip");
                  if (!trigger) return;
                  const bubble = trigger.querySelector(".widget-tooltip__bubble");
                  if (!bubble) return;
                  bubble.style.opacity = "0";
                  bubble.style.display = "block";
                  const triggerRect = trigger.getBoundingClientRect();
                  const bubbleRect = bubble.getBoundingClientRect();
                  const gap = 6;
                  const vw = window.innerWidth;
                  const vh = window.innerHeight;
                  const placeAbove =
                     triggerRect.top >= bubbleRect.height + gap ||
                     triggerRect.top >= vh - triggerRect.bottom;
                  let top;
                  if (placeAbove) {
                     top = triggerRect.top - bubbleRect.height - gap;
                     bubble.classList.remove("tt-below");
                     bubble.classList.add("tt-above");
                  } else {
                     top = triggerRect.bottom + gap;
                     bubble.classList.remove("tt-above");
                     bubble.classList.add("tt-below");
                  }
                  let left =
                     triggerRect.left + triggerRect.width / 2 - bubbleRect.width / 2;
                  left = Math.max(6, Math.min(left, vw - bubbleRect.width - 6));
                  bubble.style.top = `${top}px`;
                  bubble.style.left = `${left}px`;
                  bubble.style.opacity = "";
                  bubble.classList.add("visible");
               });
               document.addEventListener("mouseout", (e) => {
                  const trigger = e.target.closest(".widget-tooltip");
                  if (!trigger) return;
                  const bubble = trigger.querySelector(".widget-tooltip__bubble");
                  if (bubble) bubble.classList.remove("visible");
               });
            }
            return `<span class="widget-tooltip">${html}<span class="widget-tooltip__bubble">${label}</span></span>`;
         },
      };

      // Utils module
      utils = {
         // This helper method waits for a DOM element to appear matching the selector
         whenElementReady: (
            selector,
            callback,
            { timeoutMs = 7000, root = document.documentElement, once = true } = {},
         ) => {
            // First we will initialize our state variables to track the observation status
            let done = false;
            let observer = null;
            let timeout = null;

            // Then we will define the check function that verifies if the element exists and executes the callback
            const apply = () => {
               if (done) return;
               const el = document.querySelector(selector);
               if (!el) return false;
               callback(el);
               if (once) {
                  done = true;
                  observer?.disconnect();
                  clearTimeout(timeout);
               }
               return true;
            };

            // Then we will initialize the MutationObserver and start observing the root element for changes
            observer = new MutationObserver(apply);
            observer.observe(root, { childList: true, subtree: true });

            // Then we will also set a fallback timeout to stop observing if the element never appears
            timeout = setTimeout(() => {
               observer.disconnect();
            }, timeoutMs);

            // Then we will attempt an immediate check in case the element is already present in the DOM
            apply();

            // Finally return a cleanup function to allow the caller to cancel the observation manually
            return () => {
               done = true;
               observer.disconnect();
               clearTimeout(timeout);
            };
         },

         // This method waits for the element and returns it
         waitForElement: (elementSelector = "", resolveDelay = 1000, timeout = null) => {
            return new Promise((res) => {
               const interval = setInterval(() => {
                  const $element = document.querySelector(elementSelector);
                  if ($element) {
                     clearInterval(interval);
                     setTimeout(() => {
                        res($element);
                     }, resolveDelay);
                  }
                  console.log("waiting for ", elementSelector);
               }, 200);
               if (timeout) {
                  setTimeout(() => {
                     clearInterval(interval);
                     res(null);
                  }, timeout);
               }
            });
         },

         // This helper method retrieves the snapshot of an element
         getElementSnapshot: (el) => {
            if (!el) return null;
            const attributes = {};
            if (el.hasAttributes()) {
               for (const attr of el.attributes) {
                  attributes[attr.name] = attr.value;
               }
            }
            const styles = {};
            const computed = window.getComputedStyle(el);
            for (let i = 0; i < computed.length; i++) {
               const propName = computed[i];
               styles[propName] = computed.getPropertyValue(propName);
            }
            return {
               tagName: el.tagName.toLowerCase(),
               innerHTML: el.innerHTML,
               innerText: el.innerText,
               attributes: attributes,
               computedStyle: styles,
            };
         },

         // This helper method retrieves the auth information
         getAuth: async (shouldGetNewToken = false) => {
            return new Promise((res) => {
               const interval = setInterval(async () => {
                  if (window?.$cookies) {
                     // First we will retrieve the token
                     const acatToken = window?.$cookies?.get("acat");
                     const catToken = window?.$cookies?.get("cat");
                     const data = JSON.parse(window.atob(catToken || acatToken) || "{}");
                     if (!("productId" in data)) {
                        const url = location.href
                           ?.split("/products/")[1]
                           .split("/")[0]
                           .split("?")[0];
                        data.productId = url;
                     }
                     if (!("tokenId" in data)) {
                        data.tokenId = data.token;
                     }
                     clearInterval(interval);

                     // Then we will check if the token is expired, if expired we will rehydrate the token
                     if (
                        Number(data.tokenExpirationTime) <= new Date().getTime() ||
                        shouldGetNewToken
                     ) {
                        // First we will retrieve the firebase auth
                        const firebaseAuth = (() => {
                           const firebaseAuthResult = Object.keys(localStorage).reduce(
                              (a, c) => {
                                 if (c.includes("firebase:authUser")) {
                                    a = JSON.parse(localStorage.getItem(c));
                                 }
                                 return a;
                              },
                              undefined,
                           );
                           return firebaseAuthResult;
                        })();

                        // Then we will fetch a new refresh token
                        const newToken = await fetch(
                           `https://securetoken.googleapis.com/v1/token?key=${firebaseAuth.apiKey}`,
                           {
                              method: "POST",
                              mode: "cors",
                              credentials: "omit",
                              headers: {
                                 "Content-Type": "application/x-www-form-urlencoded",
                              },
                              body: `grant_type=refresh_token&refresh_token=${firebaseAuth.stsTokenManager.refreshToken}`,
                           },
                        ).then(async (res) => {
                           return res.json();
                        });

                        // Finally we will update the data and the acat token
                        const fiftyMinutesFromNow = new Date().getTime() + 50 * 60 * 1000;
                        const newAuth = {
                           ...data,
                           tokenId: newToken.id_token,
                           tokenExpirationTime: fiftyMinutesFromNow,
                        };
                        window.$cookies.set("acat", window.btoa(JSON.stringify(newAuth)));
                        res(newAuth);
                     }
                     res(data);
                  }
               }, 0);
            });
         },
      };
   }

   setTimeout(() => {
      if (!window?.MembershipParser) {
         window.MembershipParser = new MembershipParser();
      }
      if (!window?.MembershipEditor) {
         const membershipEditorInterval = setInterval(() => {
            if (sessionStorage?.is_preview) {
               clearInterval(membershipEditorInterval);
               window.MembershipEditor = new MembershipEditor();
            }
         }, 500);
         setTimeout(() => {
            clearInterval(membershipEditorInterval);
         }, 5000);
      }
   }, 0);
</script>
